<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#1b2716">
		<title>Beast Vault</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #f4ecd8;
	background-color: #1b2716;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Điện thoại: bàn cờ 1280x720 chỉ chơi được khi xoay ngang. */
#rotate-overlay {
	position: fixed;
	left: 0; top: 0; right: 0; bottom: 0;
	z-index: 30;
	display: none;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	text-align: center;
	padding: 2rem;
	background: radial-gradient(circle at 50% 40%, #314626 0%, #1b2716 70%);
	color: #f6d98a;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
}
#rotate-overlay .icon {
	font-size: clamp(3rem, 18vw, 6rem);
	line-height: 1;
	animation: turn 2s ease-in-out infinite;
}
#rotate-overlay .msg {
	margin-top: 1.2rem;
	font-size: clamp(1rem, 4.5vw, 1.4rem);
	font-weight: 700;
}
#rotate-overlay .sub {
	margin-top: .6rem;
	color: #b9d39b;
	font-size: clamp(.75rem, 3.2vw, 1rem);
}
@keyframes turn { 0%, 100% { transform: rotate(-25deg); } 50% { transform: rotate(65deg); } }
@media (orientation: portrait) and (max-width: 900px) {
	#rotate-overlay { display: flex; }
}
/* Cho phép bỏ qua khi người chơi/test không xoay được thiết bị (vd cửa sổ desktop bị thu hẹp). */
body.force-landscape #rotate-overlay { display: none !important; }
#rotate-bypass {
	margin-top: 1.4rem;
	padding: .7rem 1.1rem;
	border: 1px solid #f6d98a;
	border-radius: 10px;
	background: rgba(27, 39, 22, .85);
	color: #f6d98a;
	font: inherit;
	font-size: .9rem;
	cursor: pointer;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	/* Thay logo Godot bằng nền rêu gỗ của game. Giữ thanh tải vì file ~90 MB. */
	background: radial-gradient(circle at 50% 38%, #314626 0%, #1b2716 62%, #10180d 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-brand {
	text-align: center;
	user-select: none;
	padding: 0 1rem;
}

#status-brand .title {
	display: block;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: clamp(2rem, 7vw, 4.2rem);
	font-weight: 800;
	letter-spacing: .12em;
	color: #f6d98a;
	text-shadow: 0 3px 0 #6b4a1f, 0 8px 24px rgba(0,0,0,.55);
}

#status-brand .sub {
	display: block;
	margin-top: .6rem;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: clamp(.8rem, 2.4vw, 1.1rem);
	letter-spacing: .32em;
	color: #b9d39b;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 12%;
	width: min(52%, 420px);
	height: 12px;
	margin: 0 auto;
	accent-color: #8fbc5a;
	border: 1px solid #6b8f49;
	border-radius: 999px;
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background: #23331d;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #6f9c43, #b8d97b);
	border-radius: 999px;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #6f9c43, #b8d97b);
	border-radius: 999px;
}

#status-pct {
	display: block;
	margin-top: .8rem;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: clamp(.75rem, 2.6vw, 1rem);
	letter-spacing: .04em;
	color: #d9e8bf;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="CoThu.icon.png" />
<link rel="apple-touch-icon" href="CoThu.apple-touch-icon.png"/>
<link rel="manifest" href="CoThu.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-brand">
				<span class="title">BEAST VAULT</span>
				<span class="sub">HEX TACTICS ROYALE · LOADING...</span>
			</div>
			<progress id="status-progress"></progress>
			<span id="status-pct">Đang chuẩn bị…</span>
			<div id="status-notice"></div>
		</div>

		<div id="rotate-overlay">
			<div class="icon">↻</div>
			<div class="msg">HÃY XOAY NGANG ĐIỆN THOẠI</div>
			<div class="sub">Bàn cờ 44 ô cần màn hình ngang để hiển thị đẹp.<br>Xoay thiết bị rồi giữ nguyên hướng ngang để chơi.</div>
			<button id="rotate-bypass" type="button">Vẫn chơi ở chế độ hẹp</button>
		</div>

		<script src="CoThu.js"></script>
		<script>
// Trên mobile Google có thể tách cửa sổ phụ khỏi trang mở nó. Quay về cùng tab
// và nhận fragment tại đây, không dựa vào popup/opener.
window.__beastVaultStartGoogle = function (url) {
	try { sessionStorage.setItem('beastVaultGooglePending', String(Date.now())); }
	catch (_) { return false; }
	location.assign(url);
	return true;
};
window.__beastVaultGoogleReturn = (function () {
	try {
		const started = Number(sessionStorage.getItem('beastVaultGooglePending'));
		if (!started || Date.now() - started > 600000) return '';
		const fragment = location.hash.slice(1);
		const params = new URLSearchParams(fragment);
		if (!params.has('access_token') && !params.has('error') && !params.has('error_code')) return '';
		sessionStorage.removeItem('beastVaultGooglePending');
		history.replaceState(history.state, '', location.pathname + location.search);
		return fragment;
	} catch (_) { return ''; }
}());
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"CoThu","experimentalVK":true,"fileSizes":{"CoThu.pck":47189256,"CoThu.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"CoThu.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusPct = document.getElementById('status-pct');
	const rotateBypass = document.getElementById('rotate-bypass');
	if (rotateBypass) {
		rotateBypass.addEventListener('click', function () {
			document.body.classList.add('force-landscape');
		});
	}

	// Godot bật cờ này lúc vào trận; F5/tải lại sẽ hỏi xác nhận thay vì mất ván im lặng.
	window.__beastVaultInMatch = false;
	window.addEventListener('beforeunload', function (e) {
		if (!window.__beastVaultInMatch) return;
		e.preventDefault();
		e.returnValue = '';
		return '';
	});

	// REST cần mã HTTP + nội dung JSON đã giải mã của trình duyệt.
	window.__beastVaultRest = async function (url, method, headersJson, body, done) {
		const controller = new AbortController();
		const timer = setTimeout(() => controller.abort(), 10000);
		let status = 0;
		let text = '';
		let error = '';
		try {
			const response = await fetch(url, {
				method,
				headers: JSON.parse(headersJson),
				body: body || undefined,
				signal: controller.signal,
				credentials: 'omit',
				redirect: 'error',
			});
			status = response.status;
			text = await response.text();
		} catch (err) {
			error = err.name === 'AbortError' ? 'Server phản hồi quá chậm.' : 'Không đọc được phản hồi từ server.';
		} finally {
			clearTimeout(timer);
		}
		done(status, text, error);
	};

	// Nhắc người chơi biết đây là file game lớn, đang tải thật (không bị treo).
	setTimeout(function () {
		if (initializing && statusPct) {
			statusPct.textContent = 'Đang tải dữ liệu game (~50 MB). Vui lòng đợi…';
		}
	}, 12000);

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					if (statusPct) {
						statusPct.textContent = 'Đang tải dữ liệu game… ' + Math.floor(current * 100 / total) + '%';
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
